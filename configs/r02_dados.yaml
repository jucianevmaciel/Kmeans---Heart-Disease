rodada: R2
pergunta: Como tratar os zeros, o atalho do colesterol e o Oldpeak negativo?
herda_de: r01_escalonamento
criterio: ari_registrado   # ARI só nos 746 pacientes com colesterol registrado
nota: >
  O colesterol registrado como 0 está ligado ao diagnóstico (88% dos zerados são
  doentes), provavelmente pelo hospital de origem. Esse atalho pode aumentar o ARI
  sem nenhum motivo clínico. Por isso a rodada decide pelo ARI só nos pacientes com
  colesterol registrado, em quem o atalho não tem como ajudar; o ARI total é
  relatado. A trava relativa (decisao.trava_atalho_lift) e a de categoria rara
  impedem um grupo formado pelos ausentes.

opcoes:
  - nome: mediana
    pre: {zeros: mediana, oldpeak: manter, drop_cols: []}
  - nome: sem_colesterol
    pre: {zeros: remover_colesterol, oldpeak: manter, drop_cols: []}
  - nome: sem_colesterol_fastingbs
    pre: {zeros: remover_colesterol, oldpeak: manter, drop_cols: [FastingBS]}
  - nome: mediana_flag
    pre: {zeros: mediana_flag, oldpeak: manter, drop_cols: []}
  - nome: oldpeak_zero
    pre: {zeros: mediana, oldpeak: zero, drop_cols: []}
  - nome: oldpeak_abs
    pre: {zeros: mediana, oldpeak: abs, drop_cols: []}
