rodada: R3
pergunta: Qual o número de grupos e qual inicialização?
herda_de: r02_dados
criterio: silhueta
nota: >
  O k NÃO é escolhido pelo ARI: o diagnóstico tem 2 classes e o ARI favorece k = 2,
  o que tornaria a escolha circular. Só concorrem os k com todos os grupos estáveis
  (Jaccard por bootstrap >= decisao.jaccard_min). Entre eles, decide a silhueta,
  com empate pelo bootstrap pareado; entre os empatados vence o menor k
  (parcimônia) e depois k-means++ (ordem da grade). A silhueta de referência
  (colunas embaralhadas) é relatada: o que indica estrutura é o excesso sobre ela.
  Davies-Bouldin, Calinski-Harabasz, inércia e ARI são relatados
  (python -m src.cotovelo).

grade:
  modelo.k: [2, 3, 4, 5, 6, 7, 8]
  modelo.init: [k-means++, random]
